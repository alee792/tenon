<!doctype html>
<meta charset="utf-8">
<title>evolve — pairwise judge</title>
<style>
  :root {
    --bg:#fbfaf8; --card:#fff; --ink:#1c1b19; --muted:#6a675f; --faint:#95918a;
    --line:#e3e0d8; --accent:#534ab7; --accent-soft:#eeedfe; --tie:#8a867c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17161a; --card:#201f24; --ink:#eceae4; --muted:#9c988e; --faint:#7d7a72;
            --line:#333039; --accent:#afa9ec; --accent-soft:#2a2740; --tie:#7d7a72; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  header { padding:14px 24px; border-bottom:1px solid var(--line); display:flex; gap:14px;
           align-items:center; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { font-size:15px; font-weight:500; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .faint { color:var(--faint); font-size:12px; }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; flex:1 1 120px; min-width:90px; }
  .bar > i { display:block; height:100%; background:var(--accent); transition:width .2s; }
  main { padding:20px 24px 40px; max-width:1200px; margin:0 auto; }
  button { font:inherit; padding:8px 18px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent-soft); border-color:var(--accent); }
  button.tie { color:var(--tie); }
  button.ghost { border-color:transparent; color:var(--muted); }
  button.tab { padding:5px 13px; border-radius:999px; font-size:13px; }
  button.tab[aria-current="true"] { background:var(--accent-soft); border-color:var(--accent); }
  kbd { font:12px ui-monospace,monospace; border:1px solid var(--line); border-bottom-width:2px;
        border-radius:4px; padding:1px 5px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .task { padding:11px 16px; margin-bottom:16px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:620px) { .pair { grid-template-columns:1fr; } }
  .side { display:flex; flex-direction:column; overflow:hidden; }
  .side h2 { font-size:12px; font-weight:500; letter-spacing:.04em; color:var(--muted); margin:0;
             padding:9px 15px; border-bottom:1px solid var(--line); }
  .side h2 .gene { color:var(--ink); }
  pre { margin:0; padding:14px; white-space:pre-wrap; word-wrap:break-word;
        font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:auto; }
  .side pre { max-height:56vh; }
  .actions { display:flex; gap:11px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
  .banner { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 16px;
            margin-bottom:18px; border-left:3px solid var(--accent); border-radius:0;
            background:var(--accent-soft); }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .meter { display:inline-block; vertical-align:middle; width:96px; height:6px; border-radius:3px;
           background:var(--line); overflow:hidden; margin-right:9px; }
  .meter > i { display:block; height:100%; background:var(--accent); }
  .gene { font:12px ui-monospace,monospace; }
  .row-pick { cursor:pointer; }
  .row-pick:hover td { background:var(--accent-soft); }
  .lead td { font-weight:500; }
  h3 { font-size:13px; font-weight:500; color:var(--muted); margin:22px 0 8px; }
  .tabs { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px) { .split { grid-template-columns:1fr; } }
  .empty { text-align:center; padding:64px 24px; color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--line);
          font-size:11px; color:var(--muted); margin-left:6px; }
</style>

<header>
  <h1>evolve</h1>
  <span class="muted" id="meta">connecting…</span>
  <span class="bar"><i id="bar" style="width:0"></i></span>
  <span id="nav" style="display:flex; gap:7px"></span>
</header>
<main id="root"><div class="empty">Waiting for a generation to finish running…</div></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fx = (n, d = 3) => Number(n).toFixed(d);

let view = 'auto';       // 'auto' follows the search; 'judge'/'review' are the reader's choice
let pairId = null, busy = false, notified = 0, openGenome = null, tab = null, summary = null;
let drawn = null;        // what the review screen currently shows, so polling never redraws it
let genes = false;       // reveal the instructions behind each answer while judging

async function tick(){
  let state, sum;
  try {
    [state, sum] = await Promise.all([
      fetch('/api/state').then(r => r.json()),
      fetch('/api/summary').then(r => r.json()),
    ]);
  } catch (e) { $('meta').textContent = 'judge server unreachable'; return; }
  summary = sum;

  const pending = sum.pending;
  if (pending && pending.generation !== notified) {
    notified = pending.generation;
    ping(`Generation ${pending.generation} is ready — ${pending.total} comparisons`);
  }

  const showJudge = view === 'judge' || (view === 'auto' && pending && !state.waiting && state.pair);
  $('meta').textContent = pending
    ? `generation ${pending.generation} · ${pending.done} of ${pending.total} judged`
    : sum.finished ? `${sum.run} · search complete` : `${sum.run} · waiting for the next generation`;
  const frac = pending && pending.total ? pending.done / pending.total : (sum.finished ? 1 : 0);
  $('bar').style.width = (frac * 100) + '%';

  $('nav').innerHTML = [
    pending ? `<button class="tab ${showJudge ? 'primary' : ''}" onclick="go('judge')">Judge</button>` : '',
    sum.generations.length ? `<button class="tab ${!showJudge ? 'primary' : ''}" onclick="go('review')">Review</button>` : '',
  ].join('');

  showJudge ? renderJudge(state) : renderReview();
}

function go(v){ view = v; pairId = null; drawn = null; tick(); }

function ping(text){
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') new Notification('evolve', {body: text});
  else if (Notification.permission !== 'denied') Notification.requestPermission();
}

// ---- judging ------------------------------------------------------------

function renderJudge(s){
  if (s.waiting || !s.pair) {
    $('root').innerHTML = '<div class="empty">Waiting for a generation to finish running…</div>';
    return;
  }
  if (pairId === s.pair.id) return;   // never redraw under the reader's cursor
  pairId = s.pair.id;
  $('root').innerHTML = `
    <div class="card task"><span class="faint">task</span><br>${esc(s.task)}</div>
    <div class="pair">
      <section class="card side"><h2 style="text-transform:uppercase">A</h2><pre>${esc(s.pair.a)}</pre></section>
      <section class="card side"><h2 style="text-transform:uppercase">B</h2><pre>${esc(s.pair.b)}</pre></section>
    </div>
    <div id="genes">${genePanes(s.pair)}</div>
    <div class="actions">
      <button onclick="vote('a')">A is better</button>
      <button class="tie" onclick="vote('tie')">Tie</button>
      <button onclick="vote('b')">B is better</button>
      <button class="ghost" onclick="toggleGenes()">${genes ? 'Hide' : 'Show'} instructions</button>
      <button class="ghost" onclick="undo()">Undo last</button>
    </div>
    <p class="faint" style="text-align:center; margin-top:14px">
      <kbd>←</kbd> A &nbsp; <kbd>→</kbd> B &nbsp; <kbd>space</kbd> tie &nbsp;·&nbsp; <kbd>g</kbd> genes
    </p>`;
}

function genePanes(pair){
  if (!genes) return '';
  return `
    <p class="faint" style="margin:16px 0 8px">The gene behind each answer. Reading it before you
      decide can bias the comparison toward the instructions rather than the output.</p>
    <div class="pair">
      <section class="card side"><h2 style="text-transform:uppercase">A · its instructions</h2>
        <pre style="max-height:34vh">${esc(pair.a_gene || '(unavailable)')}</pre></section>
      <section class="card side"><h2 style="text-transform:uppercase">B · its instructions</h2>
        <pre style="max-height:34vh">${esc(pair.b_gene || '(unavailable)')}</pre></section>
    </div>`;
}

function toggleGenes(){
  genes = !genes;
  pairId = null;   // force one redraw so the panes appear
  tick();
}

async function vote(winner){
  if (!pairId || busy) return;
  busy = true;
  await fetch('/api/verdict', {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify({id: pairId, winner})});
  pairId = null; busy = false; tick();
}
async function undo(){
  busy = true;
  await fetch('/api/undo', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
  pairId = null; busy = false; tick();
}
addEventListener('keydown', e => {
  if (view === 'review') return;
  if (e.key === 'g' || e.key === 'G') { toggleGenes(); return; }
  if (e.key === 'ArrowLeft') vote('a');
  else if (e.key === 'ArrowRight') vote('b');
  else if (e.key === ' ') { e.preventDefault(); vote('tie'); }
});

// ---- reviewing ----------------------------------------------------------

function bars(rows){
  const top = Math.max(...rows.map(r => r.score), 1e-9);
  return rows.map((r, i) => `
    <tr class="row-pick ${i === 0 ? 'lead' : ''}" onclick="pick('${r.genome}')">
      <td><span class="meter"><i style="width:${(r.score / top) * 100}%"></i></span>
          <span class="gene">${r.genome}</span>${
            r.generations ? `<span class="pill">gen ${r.generations.join(', ')}</span>` : ''}</td>
      <td class="num">${fx(r.score)}</td>
      <td class="num">${fx(r.strength)}</td>
      <td class="num">${r.wins === undefined ? '' : `${r.wins} / ${r.played}`}</td>
    </tr>`).join('');
}

function renderReview(force){
  const s = summary;
  if (!s || !s.generations.length) {
    $('root').innerHTML = '<div class="empty">Nothing judged yet.</div>';
    return;
  }
  if (tab === null) tab = s.generations[s.generations.length - 1].generation;
  // Redraw only when something actually changed. Repainting on every poll
  // steals the scroll position and invalidates whatever the reader is
  // mid-click on.
  const key = JSON.stringify([tab, openGenome, s.finished, s.pending,
                              s.generations.map(g => [g.generation, g.judged])]);
  if (!force && key === drawn) return;
  drawn = key;
  const gen = s.generations.find(g => g.generation === tab) || s.generations[0];
  const judged = s.generations.reduce((n, g) => n + g.judged, 0);

  const banner = s.pending && s.pending.done < s.pending.total ? `
    <div class="card banner">
      <span><b>Generation ${s.pending.generation}</b> is ready —
        ${s.pending.total - s.pending.done} comparisons left.</span>
      <button class="primary" onclick="go('judge')">Start judging</button>
      <span class="faint">or stay here; the search waits on you either way.</span>
    </div>` : s.finished ? `
    <div class="card banner"><span>Search complete. Nothing was promoted — review the winner
      and copy it across yourself if it holds up.</span></div>` : '';

  const entry = gen.entries.find(e => e.genome === openGenome);
  const detail = !entry ? `<div class="card empty" style="padding:38px 24px">
      Pick a genome above to read its answer and the instructions that produced it.</div>` : `
    <div class="card side">
      <h2><span class="gene">${entry.genome}</span> · what it answered</h2>
      <pre style="max-height:44vh">${esc(entry.text)}</pre>
    </div>
    <div class="card side">
      <h2><span class="gene">${entry.genome}</span> · its instructions
        ${entry.operator ? `<span class="pill">${esc(entry.operator)}</span>` : ''}
        ${entry.parents.length ? `<span class="pill">from ${entry.parents.join(', ')}</span>` : ''}</h2>
      <pre style="max-height:44vh">${esc(entry.instructions)}</pre>
    </div>`;

  $('root').innerHTML = `
    ${banner}
    <div class="tabs">
      ${s.generations.map(g => `<button class="tab" aria-current="${g.generation === tab}"
          onclick="setTab(${g.generation})">Generation ${g.generation}${
          g.done ? '' : ' <span class="pill">partial</span>'}</button>`).join('')}
      <button class="tab" aria-current="${tab === 'all'}" onclick="setTab('all')">All generations</button>
    </div>
    ${tab === 'all' ? `
      <h3>every genome on one scale — one fit over all ${judged} comparisons</h3>
      <div class="card"><table>
        <tr><th>genome</th><th>score</th><th>strength</th><th></th></tr>
        ${bars(s.overall)}
      </table></div>
      <p class="faint" style="margin-top:10px">A generation's own scores are normalised inside its
        own field, so they do not compare across generations. The incumbent appears in consecutive
        rounds, and that shared entry is what makes this single fit possible.</p>
      ` : `
      <div class="card task"><span class="faint">task</span><br>${esc(gen.task)}</div>
      <h3>generation ${gen.generation} — ${gen.judged} of ${gen.comparisons} comparisons</h3>
      <div class="card"><table>
        <tr><th>genome</th><th>score</th><th>strength</th><th>record</th></tr>
        ${bars(gen.board)}
      </table></div>
      <h3>outputs</h3>
      <div class="split">${detail}</div>
      <h3>lineage</h3>
      <div class="card"><table>
        <tr><th>genome</th><th>came from</th><th>operator</th></tr>
        ${gen.entries.map(e => `<tr class="row-pick" onclick="pick('${e.genome}')">
            <td class="gene">${e.genome}</td>
            <td class="gene">${e.parents.length ? e.parents.join(', ') : '—'}</td>
            <td>${esc(e.operator || 'seed')}</td></tr>`).join('')}
      </table></div>`}`;
}

function setTab(t){ tab = t; openGenome = null; renderReview(true); }
function pick(genome){
  if (tab === 'all') {
    const owner = summary.generations.find(g => g.entries.some(e => e.genome === genome));
    if (owner) tab = owner.generation;
  }
  openGenome = openGenome === genome ? null : genome;
  renderReview(true);
}

tick(); setInterval(tick, 1200);
</script>
