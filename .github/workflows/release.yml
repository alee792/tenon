name: Release

# Split from CI deliberately: a different trigger, a different permission, and
# a different meaning when it fails. Folding this into the CI workflow would
# force `contents: write` onto every pull-request run.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release artifacts
    # GNU tar is required by scripts/release.sh (--sort/--mtime).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Create the GitHub release and upload the archives to it.
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # release.sh reads the tagged commit's timestamp, so it needs the
          # history and the tag, not just a shallow snapshot.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build release archives
        run: ./scripts/release.sh "${{ github.ref_name }}"

      - name: Verify the checksum manifest
        working-directory: dist
        run: sha256sum -c tenon_*_SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # A tag carrying a pre-release suffix (v0.1.0-rc.1) publishes as a
          # GitHub pre-release. Stability policy lives in the version itself —
          # 0.x already says "anything may change" — so this flag only marks
          # the rehearsal tags used to exercise this workflow.
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            dist/tenon_*.tar.gz dist/tenon_*_SHA256SUMS
