name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight pull-request runs, but never cancel a run on main:
  # a fast follow-up merge would otherwise destroy the only green signal the
  # previous commit ever had.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nothing here pushes, and the suite executes third-party TypeScript
          # and Python through the authored-tool hosts. Do not leave a token in
          # .git/config where those subprocesses can read it.
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Deno and uv let the polyglot authored-tool tests run rather than
      # skip. This job requires them to actually run (TENON_REQUIRE_TOOLCHAINS
      # below) so green here means the polyglot paths executed; a local run
      # without the variable still skips gracefully when they are absent.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Pinned to the same uv release images/inputs.json pins for the
          # runtime image build. An unpinned setup-uv falls back to
          # whatever "latest" is on the day CI runs — this repo's Python
          # closure determinism depends on (uv version, requested spec)
          # resolving to the same exact interpreter patch across machines
          # and time (see prepareClosurePython), and a drifting CI uv
          # silently breaks that on a schedule nobody controls. It also
          # silently changed `uv python install`'s own on-disk layout
          # between 0.8.17 and 0.12.6 (a minor-version symlink alongside
          # the patch directory) and broke staging's symlink-free
          # guarantee in exactly that way once already.
          version: "0.8.17"

      - name: Run repository checks
        # With both toolchains installed above, a skipped polyglot test would
        # be a silently broken setup step, not a passing check. Require them
        # so CI fails loudly instead of shrinking coverage without signal.
        env:
          TENON_REQUIRE_TOOLCHAINS: "1"
        run: ./scripts/check.sh

  reproducible:
    name: Release build is reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # The project claims its release artifacts are reproducible. Build the
      # real release path twice against a throwaway tag and require identical
      # checksums, so the claim is a test rather than an assertion.
      - name: Build the release archives twice and compare
        run: |
          set -eu
          git tag --force v0.0.0-reproducibility-check HEAD
          ./scripts/release.sh v0.0.0-reproducibility-check
          cp dist/tenon_*_SHA256SUMS "$RUNNER_TEMP/first.sums"
          ./scripts/release.sh v0.0.0-reproducibility-check
          if ! diff -u "$RUNNER_TEMP/first.sums" dist/tenon_*_SHA256SUMS; then
            echo "release archives are not byte-reproducible" >&2
            exit 1
          fi
          echo "release archives are byte-reproducible"
